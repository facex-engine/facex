name: Go gallery checks
on:
  push:
    paths:
      - 'go/facex/**'
      - 'Makefile'
      - 'src/**'
      - 'include/**'
      - 'tests/golden/**'
      - 'tests/bench_gallery_codes.py'
      - 'tests/bench_gallery_groups.py'
      - 'tests/check_gallery_profiles.py'
      - 'python/facex/gallery.py'
      - '.github/workflows/go-gallery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: go/facex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - name: Check concurrent access and decision boundaries
        run: go test -race -count=1 ./...
      - name: Compare 65535 rows against exhaustive search
        env:
          FACEX_GALLERY_SCALE: '1'
        run: go test -v -run '^TestIdentityGalleryScale$' -count=1 ./...
      - name: Verify threshold calibration on one million labeled scores
        env:
          FACEX_GALLERY_SCALE: '1'
        run: go test -v -run '^TestCalibrationMillion$' -count=1 ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare model fixture and verify Go decisions
        working-directory: .
        env:
          OPENBLAS_NUM_THREADS: '1'
          FACEX_GALLERY_SCALE: '1'
          FACEX_GALLERY_FIXTURE: ${{ runner.temp }}/gallery
        run: |
          make cli cli-fp32
          mv facex-cli-fp32 "$RUNNER_TEMP/facex-native-fp32"
          make cli-fp32 CFLAGS="-O3 -march=x86-64 -funroll-loops"
          cc --version | head -1
          cc -march=native -Q --help=target | awk '$1 == "-march=" || $1 == "-mavx2" || $1 == "-mavx512f" || $1 == "-mavx512vnni"'
          weights="$RUNNER_TEMP/edgeface_xs_fp32.bin"
          curl --fail --silent --show-error --location --retry 2 https://github.com/facex-engine/facex/releases/download/v1.0.0/edgeface_xs_fp32.bin -o "$weights"
          echo "d23f7b3cf8bcda5e451b48cf012e7dc6c4963d5703fafb8893f956d0203691d8  $weights" | sha256sum --check
          python -m pip install numpy==2.3.5 Pillow==12.0.0
          PYTHONPATH=python python tests/check_gallery_profiles.py "$weights" ./facex-cli ./facex-cli-fp32 "$RUNNER_TEMP/facex-native-fp32" "$FACEX_GALLERY_FIXTURE"
          cd go/facex
          gallery="$FACEX_GALLERY_FIXTURE"
          sha256sum "$gallery"/{production,fp32}/{rows,queries}
          FACEX_GALLERY_FIXTURE="$gallery/production" go test -v -run '^Test(IdentityGalleryScale|LiveGalleryScale|MathModelFixture|MathWorkloads|DecisionModelReplay|DecisionWorkloads)$' -count=1 ./...
          FACEX_GALLERY_FIXTURE="$gallery/fp32" FACEX_GALLERY_PROFILE=fp32 go test -v -run '^TestDecisionModelReplay$' -count=1 ./...
      - name: Verify concurrent engine replies against serial inference
        working-directory: go/facex
        env:
          FACEX_POOL_TEST_EXE: ${{ github.workspace }}/facex-cli
          FACEX_POOL_TEST_WEIGHTS: ${{ runner.temp }}/edgeface_xs_fp32.bin
        run: |
          go test -race -v -timeout=90s -run '^TestPoolRealEngine$' -count=1 ./...
          FACEX_POOL_TEST_EXE="$RUNNER_TEMP/facex-native-fp32" go test -race -v -timeout=90s -run '^TestPoolRealEngine$' -count=1 ./...
