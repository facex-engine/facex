name: Check the packaged FaceX REST service
on:
  push:
    branches: [verify/sdk-detector-build]
permissions:
  contents: read
jobs:
  rest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0f57a63c1bafd2d0c07a1710c89b9331a23d3b20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Call the packaged API with both released weights
        run: |
          bash download_weights.sh
          python -m pip install numpy Pillow onnx==1.18.0
          curl -fsSL --retry 2 https://media.githubusercontent.com/media/opencv/opencv_zoo/f12e12798e8314f7c074a6656816c048dcc95b7a/models/face_detection_yunet/face_detection_yunet_2023mar.onnx -o data/yunet.onnx
          echo '8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4  data/yunet.onnx' | sha256sum --check
          python tools/export_yunet_weights.py data/yunet.onnx weights/yunet_fp32.bin
          docker build -t facex-local .
          docker run -d --rm --name facex-ci -p 127.0.0.1:8080:8080 -v "$PWD/data/edgeface_xs_fp32.bin:/app/weights/edgeface_xs_fp32.bin:ro" -v "$PWD/weights/yunet_fp32.bin:/app/weights/yunet_fp32.bin:ro" facex-local
          trap 'docker logs facex-ci; docker stop facex-ci >/dev/null' EXIT
          curl -fsS --retry 12 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/health
          curl -fsS -F file=@data/test_face.jpg http://127.0.0.1:8080/embed -o "$RUNNER_TEMP/embed.json"
          curl -fsS -F file=@data/test_face.jpg 'http://127.0.0.1:8080/detect?embedding_format=base64_f32le' -o "$RUNNER_TEMP/detect.json"
          python - "$RUNNER_TEMP" <<'PY'
          import base64
          import json
          import math
          import sys
          import urllib.request
          from pathlib import Path
          folder = Path(sys.argv[1])
          embedding = json.loads((folder / "embed.json").read_text())["embedding"]
          assert len(embedding) == 512 and all(math.isfinite(x) for x in embedding)
          faces = json.loads((folder / "detect.json").read_text())["faces"]
          assert faces and len(base64.b64decode(faces[0]["embedding"])) == 2048
          data = json.dumps({"emb1": faces[0]["embedding"], "emb2": faces[0]["embedding"]}).encode()
          req = urllib.request.Request("http://127.0.0.1:8080/compare", data=data, headers={"Content-Type":"application/json"})
          reply = json.load(urllib.request.urlopen(req))
          assert reply["match"] and reply["similarity"] == 1
          print(f"REST: {len(faces)} detected, 512 components, self similarity 1")
          PY
