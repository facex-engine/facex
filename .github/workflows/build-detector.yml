name: Update the public release descriptions
on:
  push:
    branches: [verify/sdk-detector-build]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify the asset and correct its release notes
        shell: bash
        run: |
          set -eu
          release="repos/$GITHUB_REPOSITORY/releases/tags/facex-nano-1.0"
          gh api "$release" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          release = json.loads((root / "release.json").read_text())
          assert release["id"] == 322909311 and not release["draft"]
          model = next(a for a in release["assets"] if a["name"] == "facex_nano.onnx")
          assert model["size"] == 802377 and model["digest"] == "sha256:bd0094143bb4c7d04a76dcdad4e332f5985847b921ec4d6678c3fd89aaea3889"
          before = "input: 112x112 RGB float32 normalized to [-1, 1] (HWC, then transposed to CHW). face must be 5-point ArcFace aligned. output: 512-dim L2-normalized embedding."
          after = "Align the face to the five-point ArcFace template. Convert uint8 RGB pixels to float32 with `(pixel - 127.5) / 128.0` and transpose HWC to NCHW. The ONNX input is `input [1,3,112,112]`. The output is `embedding [1,256]`, a 256-component L2-normalized vector.\n\n`facex_nano.onnx` is 802,377 bytes. SHA-256 `bd0094143bb4c7d04a76dcdad4e332f5985847b921ec4d6678c3fd89aaea3889`. The tag points to commit `88465996e4cdd2e26d2169f5434bfa608a447b42`. The original note listed 512 components. The dimensions above come from the published graph. [Model guide](https://github.com/facex-engine/facex/blob/main/MFN_README.md#public-nano-release)"
          current = release["body"]
          if after not in current:
              assert current.count(before) == 1, "The release description changed"
              (root / "notes.json").write_text(json.dumps({"body": current.replace(before, after)}))
          PY
          if test -f "$RUNNER_TEMP/notes.json"; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/322909311" --input "$RUNNER_TEMP/notes.json" --silent
          fi
          gh api "$release" --jq '.body' | grep -F 'embedding [1,256]'
      - name: Correct the setup instructions for the original EdgeFace release
        shell: bash
        run: |
          set -eu
          release="repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0"
          gh api "$release" > "$RUNNER_TEMP/initial.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          release = json.loads((root / "initial.json").read_text())
          assert release["id"] == 313678133 and not release["draft"]
          assets = {a["name"]: a for a in release["assets"]}
          assert assets["edgeface_xs_fp32.bin"]["digest"] == "sha256:d23f7b3cf8bcda5e451b48cf012e7dc6c4963d5703fafb8893f956d0203691d8"
          assert assets["det_500m_int8.bin"]["size"] == 686289
          notes = release["body"]
          before, after = "- `edgeface_xs_fp32.bin` — Model weights (7 MB). Place in `data/` folder.", "- `edgeface_xs_fp32.bin` — EdgeFace XS recognition weights, 7,133,584 bytes. Place in `data/`. SHA-256 `d23f7b3cf8bcda5e451b48cf012e7dc6c4963d5703fafb8893f956d0203691d8`.\n- `det_500m_int8.bin` — detector asset from this release, 686,289 bytes. The current YuNet path uses a separately exported file. [Current setup and model contracts](https://github.com/facex-engine/facex#build-the-native-runtime)"
          if after not in notes:
              assert notes.count(before) == 1 and notes.count("./download_weights.sh") == 1
              notes = notes.replace(before, after).replace("./download_weights.sh", "bash download_weights.sh")
              notes = notes.replace("**Engine:** 3.0ms median CPU inference", "**Engine (original release):** 3.0 ms median CPU recognition").replace("**WASM:** 7ms", "**WASM (original release):** 7 ms")
              (root / "initial-notes.json").write_text(json.dumps({"body": notes}))
          PY
          if test -f "$RUNNER_TEMP/initial-notes.json"; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/313678133" --input "$RUNNER_TEMP/initial-notes.json" --silent
          fi
          gh api "$release" --jq '.body' | grep -F 'bash download_weights.sh'
