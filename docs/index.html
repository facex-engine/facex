<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FaceX</title>
<meta http-equiv="refresh" content="0; url=demo/">
<link rel="canonical" href="https://facex-engine.github.io/facex/demo/">
<style>
  body {
    background: #07090b; color: #d8dee5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0;
  }
  .card { text-align: center; padding: 40px 24px; }
  h1 { font-size: 32px; color: #fff; margin-bottom: 8px; letter-spacing: -0.02em; }
  h1 span {
    background: linear-gradient(90deg, #34d399, #10b981);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p { color: #6b7681; margin: 0 0 18px; }
  a { color: #34d399; text-decoration: none; font-weight: 600; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <h1>Face<span>X</span></h1>
    <p>Loading the live demo…</p>
    <p>If you are not redirected: <a href="demo/">open the demo</a> · <a href="https://github.com/facex-engine/facex">GitHub</a></p>
  </div>
</body>
</html>
